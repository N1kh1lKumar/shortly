spring:
  application:
    name: shortly

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortly_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

app:
  short-url-base: ${SHORT_URL_BASE:http://localhost:8080}
